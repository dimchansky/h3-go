# Lint policy: docs/lint-policy.md. The repository has two code tiers —
# mechanically ported C-shaped files (kept diffable against upstream H3 C)
# and idiomatic Go (public API files, internal/cli, tools, new tests).
# Style-tier findings are excluded ONLY for the ported tier, by path, in
# linters.exclusions.rules below; everything else lints strictly.
version: "2"

run:
  timeout: 3m
  tests: true
  issues-exit-code: 1
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - unparam
    - gocritic
    - revive
    - godot
    - nolintlint
    - misspell
    - depguard
  settings:
    depguard:
      rules:
        # DR-007 (docs/public-api-architecture.md): the production library is
        # safe Go only. The cgo parity files are tagged cgo && c2go and are
        # not selected under lint's default build tags, so no exception is
        # needed here; make check-unsafe is the authoritative gate.
        no-unsafe:
          deny:
            - pkg: unsafe
              desc: production code must not use unsafe (DR-007); unsafe is allowed only in cgo && c2go tagged parity files
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      # Full rule set, style rules included. The style rules are NOT
      # disabled globally: they apply to all idiomatic code and are excluded
      # only for the mechanically ported tier via exclusions.rules below.
      rules:
        - name: exported
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
  exclusions:
    presets: []
    rules:
      # Mechanically ported C-shaped files mirror upstream H3 C statement
      # for statement (CONTRIBUTING.md ground rule 2). Style-only rewrites —
      # `x = x + 1` → `x++`, if/else → switch, dropping else branches,
      # Go-style renames, zero-value declaration trimming — would destroy
      # the line-level diffability that upstream syncs rely on, so the
      # style-tier checks below are excluded for exactly those files:
      # `<cfile>_<name>.go` ported implementation/test files and
      # `test<Upstream>_test.go` ported upstream test suites. Correctness
      # checks (staticcheck, govet, unused, the remaining gocritic and
      # revive rules) still apply to them. Revisit an entry only if a file
      # stops being a mechanical port; see docs/lint-policy.md.
      - path: '^(algos|baseCells|bbox|coordijk|directedEdge|faceijk|h3api|h3[Ii]ndex|iterators|latLng|linkedGeo|localij|mathExtensions|polyfill|polygon|utility|vec2d|vec3d|vertex[Gg]raph|vertex)_[A-Za-z0-9_]+\.go$|^test[A-Z][A-Za-z0-9_]*_test\.go$'
        linters: [gocritic]
        text: '^(assignOp|ifElseChain):'
      - path: '^(algos|baseCells|bbox|coordijk|directedEdge|faceijk|h3api|h3[Ii]ndex|iterators|latLng|linkedGeo|localij|mathExtensions|polyfill|polygon|utility|vec2d|vec3d|vertex[Gg]raph|vertex)_[A-Za-z0-9_]+\.go$|^test[A-Z][A-Za-z0-9_]*_test\.go$'
        linters: [revive]
        text: '^(var-naming|var-declaration|indent-error-flow|increment-decrement|unreachable-code|superfluous-else|empty-block):'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
