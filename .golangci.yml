version: "2"

run:
  timeout: 3m
  tests: true
  issues-exit-code: 1
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - unparam
    - gocritic
    - revive
    - godot
    - nolintlint
    - misspell
  settings:
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    # v1: issues.exclude-use-default: false
    presets: []
    # v1: issues.exclude-rules
    rules:
      - path: '.*_test\.go$'
        linters: [govet]
        text: "fieldalignment"
      - linters: [staticcheck]
        text: "SA1019"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0