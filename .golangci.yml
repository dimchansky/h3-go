version: 2

run:
  timeout: 3m
  tests: true
  issues-exit-code: 1
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - unparam
    - gocritic
    - revive
    - godot
    - nolintlint
    - misspell

linters-settings:
  misspell:
    locale: US
  nolintlint:
    allow-leading-space: false
    require-explanation: true
    require-specific: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: '.*_test\.go$'
      linters: [govet]
      text: "fieldalignment"
    - linters: [staticcheck]
      text: "SA1019"
