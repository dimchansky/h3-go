name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (go.mod floor) + latest stable.
        go-version: [ '1.24.x', 'stable' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download deps
        run: go mod download

      - name: Format (gofmt)
        run: make fmt

      - name: No-unsafe gate (DR-007)
        run: make check-unsafe

      - name: golangci-lint
        if: matrix.go-version == 'stable'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          args: --timeout=5m

      - name: Install smrcptr
        if: matrix.go-version == 'stable'
        run: go install github.com/nikolaydubina/smrcptr@latest

      - name: Check receiver consistency (smrcptr)
        if: matrix.go-version == 'stable'
        run: smrcptr ./...

      - name: Test (pure Go)
        run: CGO_ENABLED=0 go test ./...

      - name: Test (race)
        run: go test -race ./...

  # Gates that need the upstream C sources (header parse only, no compile).
  api-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Fetch upstream H3 sources
        run: make -C testref h3-source
      - name: C-API completeness gate
        run: make check-api
      - name: Inventory is up to date
        run: |
          go run ./tools/apiinventory > /tmp/inventory.csv
          diff -u docs/c-api-inventory.csv /tmp/inventory.csv

  # Full parity suite against the original C implementation.
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Fetch upstream H3 sources
        run: make -C testref h3-source
      - name: Run cgo parity tests
        run: make test-c2go TIMEOUT=120s
