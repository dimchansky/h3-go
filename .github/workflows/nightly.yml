# Scheduled / manual / release-tag confidence checks that are too expensive
# or too low-signal to run on every push. Policy: docs/ci-policy.md.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  workflow_dispatch:
  push:
    tags: [ 'v*' ] # release gate: tags get the full battery

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
      - name: Test (race)
        run: go test -race ./...

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
      - name: Fetch upstream H3 sources
        run: make -C testref h3-source
      - name: Run cgo parity tests
        run: make test-c2go TIMEOUT=300s
        env:
          GOTRACEBACK: system
      - name: C-API completeness gate
        run: make check-api
      - name: Test and CLI inventory gates
        run: make check-test-inventory check-cli-inventory
      # Reuses the tree fetched above; failures name the fixture file
      # (subtest) and record number. Skips silently only when the fixture
      # root is not set, which the make target always sets.
      - name: Upstream fixture suites (526,546 golden records, pure Go)
        run: make test-upstream-fixtures

  # Six of the seven fuzz targets: the three h3-go-native harnesses plus
  # three of the four FuzzUpstream* ports of the upstream libFuzzer/AFL
  # harnesses (otherwise seed-corpus-only under plain `go test`).
  # FuzzUpstreamPolygonOperations stays seed-corpus-only: its input domain
  # (raw float64 coordinates, mirroring upstream) contains finite but
  # pathologically slow (~15 s) inputs that the fuzz engine kills as hung.
  # Issue #3 established this is inherited upstream behavior (H3 C is even
  # slower on the same input) in maxPolygonToCellsSizeExperimental's size
  # estimation, so no harness guard is justified; the target can return to
  # the rotation once upstream bounds the estimator
  # (testdata/fuzz-findings/README.md has the full analysis).
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
      - name: Fuzz (short smoke on each target)
        run: |
          set -euo pipefail
          for target in FuzzParseCell FuzzLatLngToCell FuzzHierarchyRoundTrip \
                        FuzzUpstreamCellOperations FuzzUpstreamCellSets \
                        FuzzUpstreamInternalCoordinates; do
            CGO_ENABLED=0 go test -fuzz "^${target}\$" -fuzztime 60s -run '^$' .
          done

  uberdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
      - name: Differential tests vs official cgo binding
        run: make test-uberdiff
      - name: Benchmark-pairing equivalence tests vs official cgo binding
        run: make test-uberbench

  cli-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
      - name: Fetch upstream H3 sources
        run: make -C testref h3-source
      - name: Differential tests vs upstream h3 executable
        run: make test-cli-diff

  cli-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
      - name: Build supported CLI targets
        run: make build-cli-cross

  # Pinned vulnerability scan of the root module (the shipped code); the
  # test-only nested interop/ modules are intentionally out of scope. Runs
  # nightly AND on every v* tag, so it is part of the release gate; `make
  # vulncheck` is the matching local defense in depth.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
      - name: govulncheck (pinned)
        run: make vulncheck

  # Digest-pinned full-history secret scan. On rc/final tag pushes this
  # run's URL and logs are the durable zero-findings evidence for the exact
  # immutable released commit (a committed scan record would be
  # self-referential). The image digest pins gitleaks v8.30.1.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: gitleaks (digest-pinned, full history)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact /repo
